# selects which env files to source prior to operations
environment: "dev" # {dev | prod}

# clip rasters to this window (decimal degrees)
#
# def gdalwarp_bounds(bbox):
#     extents = (bbox["minx"], bbox["miny"], bbox["maxx"], bbox["maxy"])
#     return " ".join(map(lambda extent: f"{extent:.3f}", extents))
#
#                minx   miny    maxx  maxy
raster_bounds: "-180.0 -84.0395 180.0 84.7879"

# Source raw rasters from the irv-datapkg STAC catalogue instead of each
# pipeline's own download rules. See README "Sourcing data from irv-datapkg".
datapkg:
  # catalogue base URI (local path, file://, s3://, https://)
  base: null
  # authenticated catalogue for private datasets (default: {base}-private)
  private_base: null
  # release to pin, e.g. "2026.1" (null: latest version of each dataset)
  release: null
  # lock file (relative to etl/); used instead of base/release when it exists.
  # Create with `snakemake --cores 1 datapkg_lock` and commit it.
  lock: datapkg.lock.yaml
  # local download cache (default: $IRV_DATAPKG_CACHE or ~/.cache/irv-datapkg)
  cache_dir: null
  # pipelines (raster/raw/{pipeline}/) to fetch from the catalogue; each needs
  # pipelines/{pipeline}/datapkg.yml. Wired so far: aqueduct, storm, ghsl_pop,
  # jrc_flood, landslide_arup
  enabled: []
