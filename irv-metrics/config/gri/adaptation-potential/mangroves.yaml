id: adaptation-potential/mangroves
title: Mangrove Restoration
documentation: /docs/adaptation-potential/mangroves
order: 2

metrics:
  opportunity_area:
    label: Opportunity Area
    unit: km2
    dimensions: [shoreline_condition]
    aggregation: sum
  implementation_cost:
    label: Implementation Cost
    unit: usd_2020
    dimensions: [shoreline_condition, implementation_approach]
    aggregation: sum
  biodiversity_benefit:
    label: Biodiversity Benefit
    unit: index
    dimensions: [shoreline_condition]
    description: Mean relative biodiversity-benefit index over the opportunity area; not additive.
  carbon_benefit:
    label: Carbon Benefit
    unit: tonnes
    dimensions: [shoreline_condition]
    aggregation: sum

dimensions:
  shoreline_condition: {default: total}
  implementation_approach: {default: natural_regeneration}

source:
  files: "{iso3}/adaptation_potential/{iso3}_adm{level}_adaptation_potential_mangroves_metrics.csv"
  format: long
  keys: {area: adm_id, iso3: country_iso3}
  metric: metric
  unit: unit
  ignore: [country_name, admin_level, adm_name, section, card, adaptation_subsection]

display:
  card: mangroves
  controls: [shoreline_condition, metric, implementation_approach]
  map: {metric: opportunity_area, dims: {shoreline_condition: total}}
