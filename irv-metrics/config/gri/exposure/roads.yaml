id: exposure/roads
title: Roads
documentation: /docs/exposure/roads
order: 3

metrics:
  length: {label: Road Length, unit: km, dimensions: [road_class], aggregation: sum}

dimensions:
  road_class: {default: all}

source:
  files: "{iso3}/exposure/{iso3}_adm{level}_exposure_roads_metrics.csv"
  format: long
  keys: {area: adm_id, iso3: country_iso3}
  unit: unit
  ignore: [country_name, admin_level, adm_name, section, card]

display:
  card: roads
  controls: [road_class]
  map: {metric: length, dims: {road_class: all}}
