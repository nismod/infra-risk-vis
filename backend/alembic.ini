# Alembic configuration for the GRI backend database.
#
# The database connection is NOT configured here: migrations/env.py connects
# using the same libpq PG* environment variables as the app (PGHOST,
# PGDATABASE, PGUSER, PGPASSWORD, ...). See README.md "Database migrations".

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision files are named <date>_<rev>_<slug>.py so they sort in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
